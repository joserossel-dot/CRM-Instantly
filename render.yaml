# render.yaml
services:
  # Backend API (Node.js)
  - type: web
    name: instantly-backend
    env: node
    plan: free
    buildCommand: npm install && npm install xlsx
    startCommand: npm start
    envVars:
      NODE_ENV: production
      RENDER: "true"
    # Persistent disk to keep SQLite DB and uploads
    disk:
      name: data
      mountPath: /data
    # Render sets PORT automatically; our server already reads process.env.PORT

  # Frontend (Vite static site)
  - type: web
    name: instantly-frontend
    env: static
    buildCommand: cd frontend && npm install && npm run build
    staticPublishPath: frontend/dist
    # Pass backend URL to the frontend via VITE_API_URL
    envVars:
      VITE_API_URL: "{{ services.instantly-backend.url }}"
