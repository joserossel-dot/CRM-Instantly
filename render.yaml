# render.yaml
services:
  # Backend API (Node.js)
  - type: web
    name: instantly-backend
    env: node
    plan: free
    rootDir: backend
    buildCommand: npm install && npm install xlsx && npm install pg
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: RENDER
        value: "true"
      - key: DATABASE_URL
        sync: false
      - key: CRM_PASSWORD
        sync: false
      - key: FRONTEND_URL
        sync: false
    # Render sets PORT automatically; our server already reads process.env.PORT

  # Frontend (Vite static site)
  - type: web
    name: instantly-frontend
    env: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    # Pass backend URL to the frontend via VITE_API_URL
    envVars:
      - key: VITE_API_URL
        sync: false
